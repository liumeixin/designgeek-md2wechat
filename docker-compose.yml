services:
  wenyan-editor:
    image: ghcr.io/liumeixin/designgeek-md2wechat:latest
    build: .
    container_name: designgeek-md2wechat
    restart: unless-stopped
    ports:
      - "18888:8080"
    volumes:
      - ./frontend:/app/frontend:ro
      - ./backend:/app/backend:ro
      - ./wenyan-data:/app/data
    environment:
      # 容器内固定监听 8080（与 Dockerfile 的 EXPOSE / 端口映射保持一致）
      - PORT=8080
      - HOST=0.0.0.0
